<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lazy Farmers — Auth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #10b981;
            --accent-2: #06b6d4;
            --accent-soft: rgba(16, 185, 129, 0.14);
            --accent-glow: rgba(16, 185, 129, 0.45);
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            --bg-dark: #070810;
            --bg-card: rgba(20, 24, 38, 0.6);
            --bg-elev: rgba(30, 36, 54, 0.6);
            --text-main: #eef1f8;
            --text-muted: #8892a8;
            --text-dim: #565f76;
            --border: rgba(255, 255, 255, 0.08);
            --border-soft: rgba(255, 255, 255, 0.05);
            --success: #10b981;
            --danger: #fb7185;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Inter', sans-serif;
            --radius: 20px;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background:
                radial-gradient(900px 600px at 18% -10%, rgba(16, 185, 129, 0.10), transparent 60%),
                radial-gradient(700px 500px at 100% 100%, rgba(6, 182, 212, 0.08), transparent 55%),
                var(--bg-dark);
            font-family: var(--sans);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }


        /* ── aurora orbs ── */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: orbDrift 18s ease-in-out infinite alternate;
        }
        body::before {
            width: 420px; height: 420px;
            top: -120px; right: -100px;
            background: rgba(16, 185, 129, 0.12);
        }
        body::after {
            width: 380px; height: 380px;
            bottom: -120px; left: -80px;
            background: rgba(6, 182, 212, 0.10);
            animation-delay: -9s;
        }
        @keyframes orbDrift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.15); }
        }


        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }


        .wrapper {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 410px;
            padding: 44px 40px 40px;
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            position: relative;
            box-shadow:
                0 24px 60px -20px rgba(0, 0, 0, 0.6),
                0 2px 0 0 rgba(255, 255, 255, 0.03) inset;
            transition: border-color 0.6s ease, box-shadow 0.6s ease;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent-gradient);
            opacity: 0.6;
        }

        .card .corner-br,
        .card .corner-bl {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: var(--accent);
            border-style: solid;
            opacity: 0.55;
            border-radius: 1px;
        }

        .card .corner-br {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
            border-bottom-right-radius: var(--radius);
        }

        .card .corner-bl {
            bottom: -1px;
            left: -1px;
            border-width: 0 0 2px 2px;
            border-bottom-left-radius: var(--radius);
        }


        .card__title {
            font-family: var(--mono);
            font-size: clamp(1.15rem, 4vw, 1.5rem);
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
            min-height: 2.2rem;
        }

        .card__title .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--accent);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            border-radius: 1px;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }


        .card__sub {
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 34px;
        }

        .error-msg {
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--danger);
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 18px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .field {
            position: relative;
            margin-bottom: 30px;
        }

        .field input {
            width: 100%;
            padding: 14px 0 8px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-family: var(--sans);
            font-size: 0.95rem;
            outline: none;
            caret-color: var(--accent);
            transition: border-color 0.3s ease;
        }

        .field label {
            position: absolute;
            left: 0;
            top: 14px;
            font-family: var(--mono);
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            pointer-events: none;
            transition: top 0.25s cubic-bezier(0.25, 0.8, 0.25, 1),
                font-size 0.25s cubic-bezier(0.25, 0.8, 0.25, 1),
                color 0.25s ease;
        }


        .field input:focus+label,
        .field input:not(:placeholder-shown)+label {
            top: -6px;
            font-size: 0.66rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .field input:focus {
            border-bottom-color: var(--accent);
            box-shadow: 0 6px 10px -8px var(--accent-glow);
        }

        /* ── auth button ── */
        #loginBtn {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: var(--mono);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.15s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.2s ease;
            box-shadow: 0 6px 24px -8px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }

        #loginBtn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0);
            transition: background 0.15s ease;
        }

        #loginBtn:hover {
            box-shadow: 0 10px 32px -8px var(--accent-glow);
            filter: brightness(1.1);
        }

        #loginBtn:active {
            transform: scale(0.97);
            filter: brightness(0.95);
        }

        #loginBtn:active::after {
            background: rgba(255, 255, 255, 0.06);
        }

        .alt-link {
            margin-top: 22px;
            text-align: center;
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }

        .alt-link a {
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 2px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .alt-link a:hover {
            color: var(--accent);
            border-bottom-color: var(--accent-soft);
        }

        .card.success {
            border-color: rgba(16, 185, 129, 0.45);
            box-shadow:
                0 24px 60px -20px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(16, 185, 129, 0.15),
                0 2px 0 0 rgba(255, 255, 255, 0.03) inset;
        }
        .card.success .card__title {
            color: var(--success);
        }

        .card.success .corner-br,
        .card.success .corner-bl {
            border-color: var(--success);
            opacity: 0.7;
        }

        #loginBtn.success-btn {
            background: var(--accent-gradient);
            box-shadow: 0 6px 26px -8px var(--accent-glow);
            color: #04130c;
        }

        /* ── snake animation for error ── */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }

        .card.shake {
            animation: shake 0.4s ease;
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            .card {
                padding: 36px 24px 32px;
            }

            .card__title {
                letter-spacing: 1px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 28px 18px 26px;
            }
        }

        @media (min-width: 1200px) {
            .card {
                max-width: 440px;
            }
        }
    </style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>

<body>

    <canvas id="bgCanvas"></canvas>

    <div class="wrapper">
        <div class="card" id="card">
            <span class="corner-br"></span>
            <span class="corner-bl"></span>

            <h1 class="card__title" id="heading"><span class="cursor" id="cur"></span></h1>
            <p class="card__sub">SECURE ACCESS</p>
            <div class="error-msg" id="error-display"></div>

            <form id="loginForm">
                <div class="field">
                    <input type="text" id="username" placeholder=" " required autocomplete="username">
                    <label for="username">Username or Email</label>
                </div>
                <div class="field">
                    <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                    <label for="password">Password</label>
                </div>
                <button type="submit" id="loginBtn">Authenticate</button>
            </form>
            <p class="alt-link"><a href="/activate">Have an activation key?</a></p>
        </div>
    </div>

    <script>
        // ─── typing effect ──────────────────────────────────────────────
        (function () {
            const text = "LAZY FARMERS AUTH";
            const el = document.getElementById('heading');
            const cursor = document.getElementById('cur');
            let i = 0;
            function tick() {
                if (i < text.length) {
                    el.insertBefore(document.createTextNode(text[i]), cursor);
                    i++;
                    setTimeout(tick, 80);
                }
            }
            tick();
        })();

        let successTriggered = false;

        // If the dashboard's shared fetch wrapper bounced us here because the
        // session lapsed mid-use, tell the operator why instead of a bare login
        // screen that looks like a random redirect.
        (function () {
            const params = new URLSearchParams(window.location.search);
            if (params.get('expired') === '1') {
                const err = document.getElementById('error-display');
                if (err) {
                    err.textContent = 'Your session expired. Please sign in again.';
                    err.style.display = 'block';
                }
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('error-display');
            const btn = document.getElementById('loginBtn');
            const card = document.getElementById('card');

            btn.textContent = "Processing…";
            btn.style.pointerEvents = "none";
            err.style.display = 'none';

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {

                        card.classList.add('success');
                        btn.textContent = "Access Granted";
                        btn.classList.add('success-btn');
                        btn.style.pointerEvents = "none";


                        successTriggered = true;
                        spawnNeuralLines();

                        setTimeout(() => { window.location.href = '/'; }, 1900);
                    } else {
                        btn.textContent = "Authenticate";
                        btn.style.pointerEvents = "auto";
                        err.textContent = data.error || "Invalid credentials";
                        err.style.display = 'block';

                        card.classList.remove('shake');
                        void card.offsetWidth;
                        card.classList.add('shake');
                    }
                })
                .catch(() => {
                    btn.textContent = "Authenticate";
                    btn.style.pointerEvents = "auto";
                    err.textContent = "Connection Error";
                    err.style.display = 'block';
                });
        });

        // ─── canvas ─────────────────────────────────────────────────────
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Dot {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.r = Math.random() * 1.5 + 0.5;
            }
            step() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > W) this.vx *= -1;
                if (this.y < 0 || this.y > H) this.vy *= -1;
            }
        }

        const DOTS = Array.from({ length: 55 }, () => new Dot());

        const neural = [];
        function spawnNeuralLines() {
            const cx = W / 2, cy = H / 2;
            const generators = [
                () => ({ sx: Math.random() * W, sy: 0 }),
                () => ({ sx: Math.random() * W, sy: H }),
                () => ({ sx: 0, sy: Math.random() * H }),
                () => ({ sx: W, sy: Math.random() * H }),
            ];
            for (let i = 0; i < 80; i++) {
                const g = generators[Math.floor(Math.random() * generators.length)]();
                const delay = i * 18;                         // stagger
                neural.push({
                    sx: g.sx, sy: g.sy,
                    cx: g.sx + (cx - g.sx) * (0.3 + Math.random() * 0.4),
                    cy: g.sy + (cy - g.sy) * (0.3 + Math.random() * 0.4),
                    tx: cx, ty: cy,
                    t: 0,
                    speed: 0.012 + Math.random() * 0.016,
                    delay,
                    elapsed: 0,
                    active: false,
                });
            }
        }

        let rafTime = 0;
        function drawNeuralLines(dt) {
            ctx.lineWidth = 1.2;
            neural.forEach(n => {
                n.elapsed += dt;
                if (n.elapsed < n.delay) return;
                if (!n.active) n.active = true;
                n.t = Math.min(n.t + n.speed, 1);
                const t = n.t;
                const ex = (1 - t) * (1 - t) * n.sx + 2 * (1 - t) * t * n.cx + t * t * n.tx;
                const ey = (1 - t) * (1 - t) * n.sy + 2 * (1 - t) * t * n.cy + t * t * n.ty;

                // trail line
                ctx.strokeStyle = `rgba(6, 182, 212, ${0.6 * (1 - t * 0.6)})`;
                ctx.beginPath();
                ctx.moveTo(n.sx, n.sy);
                ctx.quadraticCurveTo(n.cx, n.cy, ex, ey);
                ctx.stroke();

                // leading dot
                ctx.fillStyle = `rgba(6, 182, 212, ${1 - t * 0.4})`;
                ctx.beginPath();
                ctx.arc(ex, ey, 2.5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function loop(ts) {
            const dt = ts - rafTime;
            rafTime = ts;

            ctx.fillStyle = "rgba(7,8,16,0.22)";
            ctx.fillRect(0, 0, W, H);

            if (!successTriggered) {
                DOTS.forEach(d => d.step());
                for (let i = 0; i < DOTS.length; i++) {
                    for (let j = i + 1; j < DOTS.length; j++) {
                        const dx = DOTS[i].x - DOTS[j].x;
                        const dy = DOTS[i].y - DOTS[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 110) {
                            ctx.strokeStyle = `rgba(16,185,129,${(1 - dist / 110) * 0.30})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(DOTS[i].x, DOTS[i].y);
                            ctx.lineTo(DOTS[j].x, DOTS[j].y);
                            ctx.stroke();
                        }
                    }
                    ctx.fillStyle = "rgba(16,185,129,0.24)";
                    ctx.beginPath();
                    ctx.arc(DOTS[i].x, DOTS[i].y, DOTS[i].r, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                drawNeuralLines(dt);
            }

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(ts => { rafTime = ts; requestAnimationFrame(loop); });
    </script>
</body>

</html>
